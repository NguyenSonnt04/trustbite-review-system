          format: uuid
        blockedAt:
          type: string
          format: date-time
    GpsSignalRequest:
      type: object
      required:
      - latitude
      - longitude
      - accuracyMeters
      - capturedAt
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          format: double
          minimum: 0
        capturedAt:
          type: string
          format: date-time
