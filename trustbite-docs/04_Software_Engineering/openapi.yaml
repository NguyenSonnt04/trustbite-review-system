      type: object
      required:
      - reviewId
      - gpsSignalAccepted
      properties:
        reviewId:
          type: string
          format: uuid
        gpsSignalAccepted:
          type: boolean
        gpsDistanceMeters:
          type: number
          nullable: true
          description: Returned only for ADMIN and SUPER_ADMIN callers; omit on owner-facing responses to prevent adversarial calibration of GPS spoofing distance.
