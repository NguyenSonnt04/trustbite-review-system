openapi: 3.1.0
info:
  title: TrustBite MVP API
  version: 1.1.1
  description: Baseline OpenAPI contract for TrustBite MVP P0. Markdown specs remain the narrative source; this file is the
    machine-readable contract for development, mocks and contract tests.
servers:
- url: /api/v1
security:
- bearerAuth: []
tags:
- name: Auth
- name: Users
- name: Restaurants
- name: Reviews
- name: Receipts
- name: Moderation
- name: Admin
- name: Gamification
- name: Privacy
paths:
  /auth/otp/request:
    post:
      tags:
      - Auth
      security: []
      summary: Request OTP
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: OTP request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /auth/otp/verify:
    post:
      tags:
      - Auth
      security: []
      summary: Verify OTP
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: HttpOnly Secure SameSite=Strict refresh token cookie; server stores only the token hash.
              schema:
                type: string
                example: refresh_token=opaque-token; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      tags:
      - Auth
      security:
      - refreshCookieAuth: []
      summary: Refresh access token
      description: Uses the HttpOnly Secure SameSite=Strict refresh token cookie issued by the OTP verification flow; clients do not send refresh tokens in JSON bodies.
      operationId: refreshToken
      responses:
        '200':
          description: Token refreshed
          headers:
            Set-Cookie:
              description: Rotated HttpOnly Secure SameSite=Strict refresh token cookie; server stores only the token hash.
              schema:
                type: string
                example: refresh_token=opaque-token; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000
          content:
            application/json:
              schema:
                type: object
                required:
                - accessToken
                - expiresInSeconds
                properties:
                  accessToken:
                    type: string
                  expiresInSeconds:
                    type: integer
                    example: 900
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout and revoke session
      operationId: logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Error'
  /users/me:
    get:
      tags:
      - Users
      summary: Get current user
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Users
      summary: Update current user profile
      description: avatarUrl, when supplied, must reference a TrustBite-owned allowlisted media origin or a URL created by the platform avatar upload flow; arbitrary external URLs must be rejected.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 120
                dateOfBirth:
                  type: string
                  format: date
                phoneNumber:
                  type: string
                  description: E.164 or a Vietnamese ten-digit local number.
                avatarUrl:
                  type: string
                  format: uri
                  description: Must be a TrustBite-owned allowlisted media URL or a URL issued by the platform avatar upload flow; arbitrary external URLs are not accepted.
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /users/me/avatar-upload-url:
    post:
      tags:
      - Users
      summary: Create avatar upload URL
      description: Requires authentication. Returns a short-lived upload URL for a TrustBite-owned media object and binds the requested fileSizeBytes as the signed S3 Content-Length; avatarUrl on PATCH /users/me must reference the returned public media URL after upload completion. For custom CDN or path-style S3 hosts, the returned avatarUrl path includes the bucket before avatars/... so account deletion can clean up the owned object.
      operationId: createAvatarUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contentType
              - fileSizeBytes
              properties:
                contentType:
                  type: string
                  enum:
                  - image/jpeg
                  - image/png
                  - image/webp
                fileSizeBytes:
                  type: integer
                  minimum: 1
                  maximum: 5242880
      responses:
        '200':
          description: Avatar upload URL created
          content:
            application/json:
              schema:
                type: object
                required:
                - uploadUrl
                - avatarUrl
                - expiresAt
                properties:
                  uploadUrl:
                    type: string
                    format: uri
                    description: Short-lived signed URL for uploading the avatar image.
                  avatarUrl:
                    type: string
                    format: uri
                    description: TrustBite-owned allowlisted media URL accepted by PATCH /users/me after upload; custom CDN and path-style S3 hosts include /<bucket>/avatars/... for deletion cleanup compatibility.
                  expiresAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /restaurants:
    get:
      tags:
      - Restaurants
      security: []
      summary: Search ACTIVE restaurants
      operationId: listRestaurants
      parameters:
      - name: keyword
        in: query
        schema:
          type: string
      - name: lat
        in: query
        schema:
          type: number
          format: double
      - name: lng
        in: query
        schema:
          type: number
          format: double
      - name: radiusMeters
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50000
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Restaurant list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantPage'
  /restaurants/nearby:
    get:
      tags:
      - Restaurants
      security: []
      summary: List restaurants in map bounds
      operationId: listNearbyRestaurants
      parameters:
      - name: northEastLat
        in: query
        required: true
        schema:
          type: number
      - name: northEastLng
        in: query
        required: true
        schema:
          type: number
      - name: southWestLat
        in: query
        required: true
        schema:
          type: number
      - name: southWestLng
        in: query
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Restaurant list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantPage'
        '422':
          $ref: '#/components/responses/Error'
  /restaurants/{restaurantId}:
    get:
      tags:
      - Restaurants
      security: []
      summary: Get restaurant detail
      operationId: getRestaurant
      parameters:
      - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Restaurant detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantDetail'
        '404':
          $ref: '#/components/responses/Error'
  /restaurants/{restaurantId}/images:
    get:
      tags:
      - Restaurants
      summary: List managed restaurant images
      description: Requires ADMIN, SUPER_ADMIN, or an active TrustBite-local MERCHANT with an active OWNER or MANAGER assignment for this restaurant.
      operationId: listRestaurantImages
      parameters:
      - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Managed restaurant image list
          content:
            application/json:
              schema:
                type: object
                required:
                - restaurantId
                - items
                properties:
                  restaurantId:
                    type: string
                    format: uuid
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RestaurantImage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Restaurants
      summary: Upload restaurant profile image
      description: Requires ADMIN, SUPER_ADMIN, or an active TrustBite-local MERCHANT with an active OWNER or MANAGER assignment for this restaurant. The object remains private in S3 and imageUrl is a short-lived presigned HTTPS GET URL.
      operationId: uploadRestaurantImage
      parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - restaurantImage
              properties:
                restaurantImage:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP, maximum 5 MB.
                caption:
                  type: string
                  maxLength: 255
                  nullable: true
                isPrimary:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Restaurant image uploaded
          headers:
            Idempotency-Replayed:
              description: Present and true when returning a completed replay.
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantImage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /restaurants/{restaurantId}/images/{imageId}:
    delete:
      tags:
      - Restaurants
      summary: Delete a managed restaurant image
      description: Removes the image reference, promotes the deterministic newest remaining image when deleting the primary, and retries private S3 cleanup through idempotency state.
      operationId: deleteRestaurantImage
      parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: Restaurant image deleted
          headers:
            Idempotency-Replayed:
              description: Present and true when returning a completed replay.
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantImageDeleteResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /restaurants/{restaurantId}/reviews:
    get:
      tags:
      - Restaurants
      - Reviews
      security: []
      summary: List public reviews for restaurant
      description: Unauthenticated public listing. Responses include reviewerDisplayName and a nullable short-lived reviewerAvatarUrl, but omit reviewer userId, stored avatar references, and all private identity fields. Deleted users always receive a null avatar.
      operationId: listRestaurantReviews
      parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - name: status
        in: query
        description: Public-facing filter only. ALL means VERIFIED plus REFERENCE_ONLY; HIDDEN, REJECTED, and DELETED reviews are always excluded on this unauthenticated endpoint regardless of filter value.
        schema:
          type: string
          enum:
          - VERIFIED
          - REFERENCE_ONLY
          - ALL
          default: ALL
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Review list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
  /reviews:
    post:
      tags:
      - Reviews
      summary: Create review
      operationId: createReview
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReviewResponse'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /reviews/{reviewId}:
    get:
      tags:
      - Reviews
      summary: Get review detail
      description: Owner may read a review at any status. Other authenticated users may read only public VERIFIED or REFERENCE_ONLY reviews. ADMIN and SUPER_ADMIN may read any status.
      operationId: getReview
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Review detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Reviews
      summary: Update editable review
      description: Requires authentication and ownership of the review; restaurant association is immutable after creation.
      operationId: updateReview
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Reviews
      summary: Soft delete review
      description: Requires authentication and ownership of the review.
      operationId: deleteReview
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /reviews/{reviewId}/skip-verification:
    post:
      tags:
      - Reviews
      summary: Skip receipt verification and mark reference-only
      description: Requires authentication and ownership of the review.
      operationId: skipReviewVerification
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                  - USER_SKIPPED_RECEIPT
      responses:
        '200':
          description: Review marked reference-only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStatusResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /reviews/{reviewId}/reaction:
    put:
      tags:
      - Reviews
      summary: Create or replace the authenticated user's review reaction
      description: The reacting user is derived only from authenticated TrustBite context. The review must be public VERIFIED or REFERENCE_ONLY at an active restaurant.
      operationId: setReviewReaction
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReactionRequest'
      responses:
        '200':
          description: Reaction persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewReactionResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Reviews
      summary: Remove the authenticated user's review reaction
      description: Removes only the reaction owned by the authenticated TrustBite user and is idempotent.
      operationId: deleteReviewReaction
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Reaction removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewReactionResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /merchant/restaurants:
    get:
      tags:
      - Restaurants
      summary: List restaurants assigned to the current merchant
      operationId: listMerchantRestaurants
      responses:
        '200':
          description: Active restaurant assignments
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantRestaurant'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /merchant/restaurant-claims:
    get:
      tags:
      - Restaurants
      summary: List current merchant restaurant claims
      operationId: listMerchantRestaurantClaims
      responses:
        '200':
          description: Merchant claim list
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RestaurantClaim'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Restaurants
      summary: Submit private restaurant ownership evidence
      description: Creates a merchant restaurant claim. Evidence is private and is never used as customer receipt verification.
      operationId: submitMerchantRestaurantClaim
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - restaurantId
              - requestedPermissionLevel
              - evidenceFile
              properties:
                restaurantId:
                  type: string
                  format: uuid
                requestedPermissionLevel:
                  type: string
                  enum:
                  - OWNER
                  - MANAGER
                evidenceFile:
                  type: string
                  format: binary
                  description: PDF, JPEG, PNG, or WebP, maximum 10 MB.
      responses:
        '201':
          description: Restaurant claim submitted
          headers:
            Idempotency-Replayed:
              description: Present and true when returning a completed replay.
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantClaim'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /receipts:
    post:
      tags:
      - Receipts
      summary: Upload receipt for asynchronous verification
      description: Requires authentication and ownership of the target review; request reviewId must belong to the authenticated user. The server derives restaurant_id exclusively from the review record.
      operationId: uploadReceipt
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - reviewId
              - receiptImage
              properties:
                reviewId:
                  type: string
                  format: uuid
                receiptImage:
                  type: string
                  format: binary
                  description: JPG, PNG or HEIC, max 10MB.
                latitude:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                gpsAccuracyMeters:
                  type: number
                  format: double
                  minimum: 0
                capturedAt:
                  type: string
                  format: date-time
      responses:
        '202':
          description: Receipt accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptUploadResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /receipts/{receiptVerificationId}:
    get:
      tags:
      - Receipts
      summary: Get receipt verification status
      description: Requires authentication and ownership of the receipt verification record; receipt_verifications.user_id must match the authenticated user.
      operationId: getReceiptVerification
      parameters:
      - $ref: '#/components/parameters/ReceiptVerificationId'
      responses:
        '200':
          description: Receipt status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptVerification'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /moderation/reports:
    post:
      tags:
      - Moderation
      summary: Report a review or entity
      description: Requires authentication; reports are tied to the submitting user for abuse prevention and deduplication.
      operationId: createModerationReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModerationReportRequest'
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                type: object
                required:
                - reportId
                - status
                properties:
                  reportId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ModerationReportStatus'
        '401':
