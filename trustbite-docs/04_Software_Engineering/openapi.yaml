          nullable: true
          description: Source locale detected or returned by the translation provider when available.
          example: en
        targetLocale:
          type: string
          example: vi
        originalTextHash:
          type: string
          description: SHA-256 hash of the current canonical review comment used for cache validation.
        translatedText:
          type: string
          maxLength: 10000
        provider:
          type: string
          enum:
          - GOOGLE_TRANSLATE
        cached:
          type: boolean
