      description: >
        Requires ADMIN or SUPER_ADMIN role. Decisions map to receipt status as follows:
        APPROVE_VERIFIED -> VERIFIED, MARK_REFERENCE_ONLY -> REFERENCE_ONLY,
        REJECT -> REJECTED unless keepReviewAsReference=true keeps the review
        reference-only, and REQUEST_MORE_REVIEW keeps the receipt in
        PENDING_ADMIN_REVIEW while writing an audit log/escalation marker so the
        admin queue can distinguish escalated cases from first-pass pending cases.
