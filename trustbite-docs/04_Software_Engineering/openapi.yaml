        adminWebSession: []
      summary: Update a restaurant image caption or make it primary
      operationId: adminWebUpdateRestaurantImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRestaurantImageUpdate'
      responses:
        '200':
          description: Image updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantImage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Admin, Restaurants, Media]
      security:
      - adminBffSecret: []
        adminWebSession: []
      summary: Remove a restaurant image
      operationId: adminWebDeleteRestaurantImage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '200':
          description: Image removed and primary replacement reported
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /admin-web/restaurants/{restaurantId}/images/{imageId}/replace:
    post:
      tags: [Admin, Restaurants, Media]
      security:
      - adminBffSecret: []
        adminWebSession: []
      summary: Replace a restaurant image
      operationId: adminWebReplaceRestaurantImage
      parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminRestaurantImageUpload'
      responses:
        '200':
          description: Replacement image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantImage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /admin/users/{userId}/suspend:
    post:
      tags:
      - Admin
      - Users
      summary: Suspend a user account
      description: Requires ADMIN or SUPER_ADMIN role. Sets users.status to SUSPENDED, revokes active sessions, and writes an audit log. This is account suspension, distinct from user_blocks, review restriction, and account deletion.
      operationId: adminSuspendUser
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserStatusChangeRequest'
      responses:
        '200':
          description: User suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSuspendUserResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /admin/users/{userId}/reactivate:
    post:
      tags:
      - Admin
      - Users
      summary: Reactivate a suspended user account
      description: Requires ADMIN or SUPER_ADMIN role. Sets users.status from SUSPENDED back to ACTIVE and writes an audit log. Revoked sessions are not restored; the user must authenticate again.
      operationId: adminReactivateUser
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserStatusChangeRequest'
      responses:
        '200':
          description: User reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReactivateUserResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /users/{userId}/block:
    post:
      tags:
      - Users
      - Moderation
      summary: Block a user
      operationId: blockUser
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
      responses:
        '200':
          description: User blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockUserResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Users
      - Moderation
      summary: Unblock a user
      operationId: unblockUser
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User unblocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /reviews/{reviewId}/gps:
    post:
      tags:
      - Reviews
      - Receipts
      summary: Submit optional GPS verification signal for a review
      description: Requires authentication and ownership of the review; reviewId must belong to the authenticated user before GPS data can affect fraud scoring. GPS submission is accepted only while the linked receipt verification is UPLOADED, OCR_PROCESSING, or OCR_SUCCESS and before the fraud score is finalized. Once status becomes VERIFIED, REFERENCE_ONLY, REJECTED, or PENDING_ADMIN_REVIEW, GPS cannot trigger re-scoring and must be rejected with 409.
      operationId: submitReviewGpsSignal
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GpsSignalRequest'
      responses:
        '200':
          description: GPS signal accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpsSignalResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /reviews/{reviewId}/translation:
    post:
      tags:
      - Reviews
      summary: Translate a review comment on demand
      description: >-
        Requires authentication and review visibility. The original review comment remains
        canonical; translated text is derived display data and must not affect trust score,
        fraud scoring, receipt verification, or moderation decisions. Rate limits are 30
        translation requests/hour/user with a 5 requests/minute burst and a secondary 120
        requests/hour/IP limit. If Google returns timeout or 5xx five times within five
        minutes, the backend opens a 60-second circuit breaker; cache miss returns 503 while
        cache hit still serves normally.
      operationId: translateReviewComment
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewTranslationRequest'
      responses:
        '200':
          description: Review translation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewTranslationResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly Secure SameSite=Strict refresh token cookie issued by auth endpoints; raw token values must not be exposed to JavaScript or stored in localStorage.
    adminBffSecret:
      type: apiKey
      in: header
      name: x-trustbite-bff-secret
      description: Server-only credential used only between Next.js and Express.
    adminWebSession:
      type: apiKey
      in: header
      name: x-trustbite-admin-session
      description: Opaque admin session marker forwarded by the Next.js BFF; never exposed to browser JavaScript.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReceiptVerificationId:
      name: receiptVerificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 key used to replay the completed response safely and reject reuse with a different payload.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    OtpRequest:
      type: object
      required:
      - phoneNumber
      properties:
        phoneNumber:
          type: string
          minLength: 7
          maxLength: 20
          pattern: '^\+?[0-9]{7,15}$'
          example: '+84901234567'
    OtpRequestResponse:
      type: object
      required:
      - requestId
      - expiresInSeconds
      - nextAllowedRequestAt
      properties:
        requestId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
          example: 120
        nextAllowedRequestAt:
          type: string
          format: date-time
    OtpVerifyRequest:
      type: object
      required:
      - phoneNumber
      - otpCode
      properties:
        phoneNumber:
          type: string
          minLength: 7
          maxLength: 20
          pattern: '^\+?[0-9]{7,15}$'
          example: '+84901234567'
        otpCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
    AuthResponse:
      type: object
      required:
      - accessToken
      - user
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
      - id
      - rankCode
      - status
      - expPoints
      - profileComplete
      properties:
        id:
          type: string
          format: uuid
        phoneNumber:
          type: string
          nullable: true
          description: Mask in admin/public contexts.
        displayName:
          type: [string, 'null']
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true
        profileComplete:
          type: boolean
        role:
          type: string
          enum:
          - USER
          - MERCHANT
          - ADMIN
          - SUPER_ADMIN
        roles:
          type: array
          description: TrustBite-local roles used for server-side authorization.
          items:
            type: string
            enum:
            - USER
            - MERCHANT
            - ADMIN
            - SUPER_ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - REVIEW_RESTRICTED
          - SUSPENDED
          - DELETED
        expPoints:
          type: integer
        rankCode:
          type: string
    Restaurant:
      type: object
      required:
      - id
      - name
      - address
      - status
      - primaryImageUrl
      - verifiedReviewCount
      - referenceReviewCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        trustScore:
          type: number
          nullable: true
        verifiedReviewCount:
          type: integer
        referenceReviewCount:
          type: integer
        status:
          type: string
          enum:
          - ACTIVE
        primaryImageUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Short-lived presigned HTTPS URL for the newest restaurant-level primary image. Branch images and private receipt evidence are excluded.
    RestaurantDetail:
      allOf:
      - $ref: '#/components/schemas/Restaurant'
      - type: object
        properties:
          description:
            type: string
            nullable: true
          ratingBreakdown:
            type: object
            additionalProperties: true
          ownerClaimStatus:
            type: string
            nullable: true
    RestaurantImage:
      type: object
      required:
      - id
      - restaurantId
      - branchId
      - imageUrl
      - caption
      - isPrimary
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        branchId:
          type:
          - string
          - 'null'
          format: uuid
        imageUrl:
          type: string
          format: uri
          description: Short-lived presigned HTTPS GET URL. Refetch restaurant data after expiration.
        caption:
          type:
          - string
          - 'null'
          maxLength: 255
        isPrimary:
          type: boolean
        createdAt:
          type: string
          format: date-time
    RestaurantImageDeleteResult:
      type: object
      required:
      - id
      - restaurantId
      - deleted
      - wasPrimary
      - promotedPrimaryImageId
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        deleted:
          type: boolean
          const: true
        wasPrimary:
          type: boolean
        promotedPrimaryImageId:
          type:
          - string
          - 'null'
          format: uuid
    MerchantRestaurant:
      type: object
      required:
      - id
      - name
      - status
      - permissionLevel
      - assignmentStatus
      - primaryImageUrl
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type:
          - string
          - 'null'
        address:
          type:
          - string
          - 'null'
        status:
          type: string
        permissionLevel:
          type: string
          enum:
          - OWNER
          - MANAGER
          - STAFF
        assignmentStatus:
          type: string
          enum:
          - ACTIVE
        primaryImageUrl:
          type:
          - string
          - 'null'
          format: uri
    RestaurantClaim:
      type: object
      required:
      - id
      - merchantId
      - restaurantId
      - requestedPermissionLevel
      - status
      - evidenceUrl
      - adminNote
      - decidedBy
      - decidedAt
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        merchantUserId:
          type:
          - string
          - 'null'
          format: uuid
        merchantName:
          type:
          - string
          - 'null'
        businessName:
          type:
          - string
          - 'null'
        restaurantId:
          type: string
          format: uuid
        restaurantName:
          type:
          - string
          - 'null'
        requestedPermissionLevel:
          type: string
          enum:
          - OWNER
          - MANAGER
        status:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - APPROVED
          - REJECTED
        evidenceUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Short-lived private signed URL for authorized review only.
        adminNote:
          type:
          - string
          - 'null'
        decidedBy:
          type:
          - string
          - 'null'
          format: uuid
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminRestaurant:
      type: object
      required:
      - id
      - name
      - status
      - trustScore
      - primaryImageUrl
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type:
          - string
          - 'null'
        address:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - SUSPENDED
          - CLOSED
        trustScore:
          type:
          - number
          - 'null'
        primaryImageUrl:
          type:
          - string
          - 'null'
          format: uri
    AdminRestaurantPage:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminRestaurant'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    RestaurantPage:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Restaurant'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CreateReviewRequest:
      type: object
      required:
      - restaurantId
      - foodRating
      - priceRating
      - serviceRating
      - ambienceRating
      - comment
      properties:
        restaurantId:
          type: string
          format: uuid
        foodRating:
          type: integer
          minimum: 1
          maximum: 5
        priceRating:
          type: integer
          minimum: 1
          maximum: 5
        serviceRating:
          type: integer
          minimum: 1
          maximum: 5
        ambienceRating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          minLength: 30
          maxLength: 5000
          description: Minimum 30 characters for Reference reviews. Server must enforce 50 characters before allowing receipt verification / VERIFIED intent per BR-REV-002.
        visitedAt:
          type: string
          format: date-time
    UpdateReviewRequest:
      type: object
      minProperties: 1
      properties:
        foodRating:
          type: integer
          minimum: 1
          maximum: 5
        priceRating:
          type: integer
          minimum: 1
          maximum: 5
        serviceRating:
          type: integer
          minimum: 1
          maximum: 5
        ambienceRating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          minLength: 30
          maxLength: 5000
          description: Editable review text. Server must enforce 50 characters before allowing receipt verification / VERIFIED intent per BR-REV-002.
    CreateReviewResponse:
      type: object
      required:
      - reviewId
      - status
      - nextStep
      properties:
        reviewId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ReviewStatus'
        nextStep:
          type: string
          enum:
          - UPLOAD_RECEIPT
          - SKIP_VERIFICATION
    ReviewStatusResponse:
      type: object
      required:
      - reviewId
      - status
      - verificationStatus
      - trustLabel
      - publicVisibility
      - trustWeightBucket
      properties:
        reviewId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ReviewStatus'
        verificationStatus:
          $ref: '#/components/schemas/ReviewVerificationStatus'
        trustLabel:
          $ref: '#/components/schemas/TrustLabel'
        publicVisibility:
          $ref: '#/components/schemas/PublicVisibility'
        trustWeightBucket:
          $ref: '#/components/schemas/TrustWeightBucket'
    Review:
      allOf:
      - $ref: '#/components/schemas/ReviewStatusResponse'
      - type: object
        required:
        - id
        - restaurantId
        - foodRating
        - priceRating
        - serviceRating
        - ambienceRating
        - comment
        - createdAt
        properties:
          id:
            type: string
            format: uuid
          restaurantId:
            type: string
            format: uuid
          userId:
            type: string
            format: uuid
            description: Omit on unauthenticated/public responses. Populate only for the review owner and ADMIN/SUPER_ADMIN callers.
          reviewerDisplayName:
            type: string
            description: Public review author name. Uses `Người dùng TrustBite` when the author is deleted or has no display name.
          reviewerAvatarUrl:
            type: string
            format: uri
            nullable: true
            description: Short-lived read URL for a TrustBite-owned avatar. Null when missing, deleted, invalid, or temporarily unavailable.
          reactionCounts:
            $ref: '#/components/schemas/ReviewReactionCounts'
            description: Anonymous public aggregates only. Reacting-user identities are never returned.
          foodRating:
            type: integer
          priceRating:
            type: integer
          serviceRating:
            type: integer
          ambienceRating:
            type: integer
          averageRating:
            type: number
          comment:
            type: string
          visitedAt:
            type: string
            format: date-time
            nullable: true
          createdAt:
            type: string
            format: date-time
    ReviewPage:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ReviewReactionCounts:
      type: object
      required:
      - LOVE
      - HAHA
      - ANGRY
      properties:
        LOVE:
          type: integer
          minimum: 0
        HAHA:
          type: integer
          minimum: 0
        ANGRY:
          type: integer
          minimum: 0
    ReviewReactionRequest:
      type: object
      additionalProperties: false
      required:
      - reactionType
      properties:
        reactionType:
          type: string
          enum:
          - LOVE
          - HAHA
          - ANGRY
    ReviewReactionResponse:
      type: object
      required:
      - reviewId
      - myReaction
      - reactionCounts
      properties:
        reviewId:
          type: string
          format: uuid
        myReaction:
          type: string
          nullable: true
          enum:
          - LOVE
          - HAHA
          - ANGRY
        reactionCounts:
          $ref: '#/components/schemas/ReviewReactionCounts'
    ReceiptUploadResponse:
      type: object
      required:
      - receiptVerificationId
      - status
      - processingStatus
      properties:
        receiptVerificationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ReceiptStatus'
          description: Current persisted receipt verification status for the receiptVerificationId. On initial 202 acceptance this is usually UPLOADED or OCR_PROCESSING; on idempotency-key replay it must return the latest stored status reached by the worker, such as OCR_SUCCESS, VERIFIED, PENDING_ADMIN_REVIEW, REFERENCE_ONLY, REJECTED, or OCR_FAILED.
        processingStatus:
          $ref: '#/components/schemas/ReceiptStatus'
          description: Client-facing async pipeline state to drive polling/progress UI. On first acceptance it reflects the processing step just started (UPLOADED or OCR_PROCESSING); on idempotency-key replay it mirrors the latest pipeline state and must not be interpreted as a separate HTTP acceptance result.
    ReceiptVerification:
      type: object
      required:
      - id
      - reviewId
      - status
      - reviewStatusSnapshot
      - trustLabel
      - fraudRiskBucket
      properties:
        id:
          type: string
          format: uuid
        reviewId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ReceiptStatus'
        reviewStatusSnapshot:
          $ref: '#/components/schemas/ReviewStatus'
        trustLabel:
          $ref: '#/components/schemas/TrustLabel'
        ocrSimilarity:
          type: number
          nullable: true
          description: Returned only for ADMIN and SUPER_ADMIN callers; omit on owner-facing responses to prevent adversarial calibration.
        gpsDistanceMeters:
          type: number
          nullable: true
          description: Returned only for ADMIN and SUPER_ADMIN callers; omit on owner-facing responses to prevent adversarial calibration.
        fraudRiskBucket:
          type: string
          description: Coarse user-facing fraud signal; exact numeric fraud scores and raw sub-signals are admin-only to avoid adversarial calibration.
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - UNKNOWN
        decision:
          type: string
          nullable: true
    CreateModerationReportRequest:
      type: object
      required:
      - entityType
      - entityId
      - reasonCode
      properties:
        entityType:
          type: string
          enum:
          - REVIEW
        entityId:
          type: string
          format: uuid
        reasonCode:
          type: string
          enum:
          - SPAM_OR_FAKE
          - ABUSIVE_LANGUAGE
          - PRIVACY
          - OTHER
        description:
          type: string
          maxLength: 1000
    ModerationReport:
      type: object
      required:
