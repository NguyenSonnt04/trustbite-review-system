      - entityType
      - entityId
      - reasonCode
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        reasonCode:
          type: string
        reporterId:
          type: string
          format: uuid
          description: Admin-only reporter identifier; omit from public-facing responses.
        maskedReporter:
          type: string
          description: Admin-facing masked reporter display value for abuse-pattern review.
        status:
          $ref: '#/components/schemas/ModerationReportStatus'
        createdAt:
          type: string
          format: date-time
    AdminReceiptQueuePage:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - id
            - reviewId
            - restaurantName
            - status
            - riskScore
            - ageHours
            properties:
              id:
                type: string
                format: uuid
              reviewId:
                type: string
                format: uuid
              maskedUser:
                type: string
              restaurantName:
                type: string
