        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    AdminReceiptDecisionRequest:
      type: object
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - APPROVE_VERIFIED
          - MARK_REFERENCE_ONLY
          - REJECT
          - REQUEST_MORE_REVIEW
          description: REQUEST_MORE_REVIEW leaves newStatus as PENDING_ADMIN_REVIEW and must create an audit/escalation record with the admin reason; clients should surface it separately from first-pass pending cases.
        reason:
          type: string
          minLength: 10
        keepReviewAsReference:
          type: boolean
          description: Only valid for REJECT when admin chooses to keep review as reference-only. Requests with keepReviewAsReference=true and any non-REJECT decision must fail with 422 INVALID_RECEIPT_DECISION_COMBINATION.
