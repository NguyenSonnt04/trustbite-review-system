name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-server:
    name: Web and server checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: trustbite_user
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}"
          POSTGRES_DB: trustbite_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustbite_user -d trustbite_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Lint client
        run: npm run lint --prefix client

      - name: Build client
        run: npm run build --prefix client
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_AWS_REGION: ap-southeast-1

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Build server
        run: npm run build --prefix server

      - name: Run database migrations
        run: npm run db:migrate --prefix server
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: trustbite_user
          DATABASE_PASSWORD: "ci-${{ github.run_id }}"
          DATABASE_NAME: trustbite_db

      - name: Test server
        run: npm run test --prefix server
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: trustbite_user
          DATABASE_PASSWORD: "ci-${{ github.run_id }}"
          DATABASE_NAME: trustbite_db
          AWS_COGNITO_USER_POOL_ID: local-test-pool
          AWS_COGNITO_CLIENT_ID: local-test-client
          AWS_REGION: us-east-1
          TRUSTBITE_AVATAR_ALLOWED_HOSTS: cdn.trustbite.test

      - name: Install Harness CLI
        run: |
          HARNESS_INSTALLER_REV=79c9bb2938e3b1669af83be59a05d4b1988bf0ca
          HARNESS_INSTALLER_SHA256=a325858018b9e8bc06dc3032d876a68c2513099f4b68b0f206b2afffc0a2c958
          curl -fsSLo /tmp/install-harness.sh "https://raw.githubusercontent.com/hoangnb24/repository-harness/${HARNESS_INSTALLER_REV}/scripts/install-harness.sh"
          echo "${HARNESS_INSTALLER_SHA256}  /tmp/install-harness.sh" | sha256sum --check --status
          HARNESS_SOURCE_BASE_URL="https://raw.githubusercontent.com/hoangnb24/repository-harness/${HARNESS_INSTALLER_REV}" bash /tmp/install-harness.sh --merge --yes

      - name: Query Harness matrix
        run: |
          npm run harness -- init
          npm run harness -- import brownfield
          npm run harness -- query matrix

      - name: Write CI summary
        if: always()
        run: |
          {
            echo "## TrustBite CI"
            echo ""
            echo "| Check | Status |"
            echo "| --- | --- |"
            echo "| Client install | completed |"
            echo "| Client lint | completed when this job is green |"
            echo "| Client build | completed when this job is green |"
            echo "| Server dependency install | completed |"
            echo "| Server build | completed when this job is green |"
            echo "| Server tests | completed when this job is green |"
            echo "| Harness matrix query | completed when this job is green |"
          } >> "$GITHUB_STEP_SUMMARY"

  mobile:
    name: Mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Run mobile tests
        run: flutter test
        working-directory: mobile

      - name: Write mobile summary
        if: always()
        run: |
          {
            echo "## TrustBite Mobile CI"
            echo ""
            echo "Flutter dependency install and tests run from \`mobile/\`."
          } >> "$GITHUB_STEP_SUMMARY"
