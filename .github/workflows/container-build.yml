name: Container Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build and scan ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: client
            context: ./client
            dockerfile: ./client/Dockerfile
            image: trustbite-client
          - service: server
            context: ./server
            dockerfile: ./server/Dockerfile
            image: trustbite-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image locally
        uses: docker/build-push-action@ee4ca427a2f43b6a16632044ca514c076267da23 # v6.19.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000
            NEXT_PUBLIC_AWS_REGION=ap-southeast-1
            BUILDKIT_INLINE_CACHE=1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@0e9f55954318745b37b7933c693bc093f7336125 # v4.35.1
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Write container summary
        if: always()
        run: |
          {
            echo "## TrustBite Container Build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Service | ${{ matrix.service }} |"
            echo "| Image | ${{ matrix.image }}:${{ github.sha }} |"
            echo "| Push enabled | false |"
            echo "| AWS deploy | not configured |"
            echo ""
            echo "This workflow validates Docker builds and scans local images only."
          } >> "$GITHUB_STEP_SUMMARY"
